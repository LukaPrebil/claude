# Manual releases: version computed from conventional commits since the
# last tag; a bot commit carries CHANGELOG.md and the package version.
# See docs/adr/0011-semantic-release-on-manual-dispatch.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the computed release without creating it
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The bot commit pushes to the protected main; the default token is a
          # non-admin and gets rejected. Pushing under an admin PAT exempts it
          # via the protection's non_admins enforcement (no bypass grant).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install semantic-release and plugins
        run: >
          npm install --global
          semantic-release@25.0.9
          @semantic-release/commit-analyzer@13
          @semantic-release/release-notes-generator@14
          @semantic-release/npm@13
          @semantic-release/github@12
          @semantic-release/changelog@6
          @semantic-release/git@10

      - name: Cut release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          semantic-release $ARGS
